<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Маркетплейс</title>
    <!-- Обязательный скрипт для Telegram WebView -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #18222d;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #212d3b;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h1 { margin-bottom: 10px; font-size: 20px; }
        p { color: #8093a7; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Маркетплейс</h1>
        <p>Веб-приложение успешно запущено!</p>
    </div>

    <script>
        // Сообщаем Telegram, что приложение загрузилось
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
