<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Доска объявлений ПМР</title>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f4f5);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #1c1c1e);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --link-color: var(--tg-theme-link-color, #007aff);
            --button-bg: var(--tg-theme-button-color, #007aff);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 12px;
            padding-bottom: 30px;
        }

        header {
            margin-bottom: 16px;
            text-align: center;
        }

        header h1 {
            font-size: 20px;
            font-weight: 700;
        }

        .listings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background-color: #e5e5ea;
        }

        .no-photo {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--hint-color);
            font-size: 13px;
            height: 140px;
            background-color: #e5e5ea;
        }

        .card-content {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-price {
            font-size: 16px;
            font-weight: 700;
            color: #34c759;
            margin-bottom: 4px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-location {
            font-size: 12px;
            color: var(--hint-color);
            margin-top: auto;
        }

        .loading, .empty-msg {
            text-align: center;
            padding: 40px 0;
            color: var(--hint-color);
            font-size: 15px;
        }

        .btn-contact {
            margin-top: 8px;
            width: 100%;
            padding: 8px;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>🛍️ Доска объявлений</h1>
    </header>

    <div id="loading" class="loading">Загрузка объявлений...</div>
    <div id="listings" class="listings-grid"></div>

    <!-- Подключаем наш скрипт правильным образом -->
    <script src="app.js?v=3"></script>
</body>
</html>
